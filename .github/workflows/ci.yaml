name: RoomEase CI
on:
  push:
    branches: ["underdevelopment"]
  pull_request:
    branches: ["master"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{runner.os}}-${{hashFiles('**/pom.xml')}}
          restore-keys: | 
            maven-${{ runner.os }}

      - name: Run tests and build
        run: mvn clean install -Dspring.profile.active=ci